name: Build macOS

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the built artifacts to a downloadable GitHub prerelease"
        type: boolean
        default: true
      build_version:
        description: "Optional exact semver to use for this platform build"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Leaf for macOS (arm64 + x64)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply roadmap source cleanup
        run: npm run source:cleanup

      - name: Install dependencies
        run: npm ci

      - name: Run static QA
        run: |
          npm run source:cleanup
          npm run qa:startup-readiness
          npm run qa:startup-adversarial
          npm run qa:static
          npm run qa:fidelity
          npm run qa:scripted-html-edit
          npm run qa:release-version
          npm run qa:zoom-scrollbar
          npm run qa:theme-light
          npm run qa

      - name: Build macOS dmg + zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LEAF_BUILD_VERSION: ${{ inputs.build_version }}
          LEAF_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run dist:mac

      - name: Read app version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        id: collect
        run: |
          out="release-v${{ steps.meta.outputs.version }}"
          mkdir -p macos-artifacts
          find "$out" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} macos-artifacts/ \;
          cd macos-artifacts
          shasum -a 256 * > SHA256SUMS.txt
          ls -lh
          echo "dir=macos-artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-macOS-${{ steps.meta.outputs.version }}
          path: macos-artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish downloadable release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.meta.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease=""
          else
            tag="macos-v${version}"
            prerelease="--prerelease"
          fi
          cat > release-notes.md <<NOTES
          Unsigned macOS build of Leaf ${version} for Apple Silicon (\`arm64\`) and Intel (\`x64\`).

          | File | Target |
          | --- | --- |
          | \`Leaf-${version}-mac-arm64.dmg\` | Apple Silicon installer |
          | \`Leaf-${version}-mac-x64.dmg\` | Intel installer |
          | \`Leaf-${version}-mac-arm64.zip\` | Apple Silicon app bundle |
          | \`Leaf-${version}-mac-x64.zip\` | Intel app bundle |

          The build is signed ad-hoc but not notarized, so macOS blocks it on first launch.
          After moving Leaf to /Applications, run:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Leaf.app
          \`\`\`

          or right-click the app and choose **Open**.

          Checksums are in \`SHA256SUMS.txt\`.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Leaf ${version} - macOS" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              $prerelease
          else
            gh release edit "$tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" macos-artifacts/* --clobber
          echo "Download page: $(gh release view "$tag" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
