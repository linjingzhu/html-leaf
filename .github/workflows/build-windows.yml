name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the built artifacts to a downloadable GitHub prerelease"
        type: boolean
        default: true
  push:
    branches:
      - "stable"
      - "claude/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Leaf for Windows (x64)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static QA
        run: npm run qa:static && npm run qa:theme-light

      - name: Build Windows installer + zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LEAF_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run dist:win

      - name: Read app version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        run: |
          out="release-v${{ steps.meta.outputs.version }}"
          mkdir -p windows-artifacts
          find "$out" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) -exec cp {} windows-artifacts/ \;
          cd windows-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-Windows-${{ steps.meta.outputs.version }}
          path: windows-artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish downloadable release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.meta.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease=""
          else
            tag="windows-v${version}"
            prerelease="--prerelease"
          fi
          cat > release-notes.md <<NOTES
          Unsigned Windows build of Leaf ${version} (\`x64\`).

          | File | Target |
          | --- | --- |
          | \`Leaf-Setup-${version}-x64.exe\` | NSIS installer |
          | \`Leaf-${version}-x64.zip\` | Portable app folder |

          The build is not signed with a code-signing certificate, so SmartScreen may show
          "Windows protected your PC" on first run. Choose **More info -> Run anyway**.

          Checksums are in \`SHA256SUMS.txt\`.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Leaf ${version} - Windows" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              $prerelease
          else
            gh release edit "$tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" windows-artifacts/* --clobber
          echo "Download page: $(gh release view "$tag" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
