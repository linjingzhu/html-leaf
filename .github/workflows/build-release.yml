name: Build Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish all platform artifacts to one downloadable GitHub prerelease"
        type: boolean
        default: true
      build_version:
        description: "Optional exact semver for all platform artifacts"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  prepare-version:
    name: Compute release version once
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute shared build version
        id: version
        env:
          LEAF_BUILD_VERSION: ${{ inputs.build_version }}
          LEAF_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/compute-release-version.js >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Leaf for Windows (x64)
    runs-on: windows-latest
    needs: prepare-version
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply roadmap source cleanup
        run: npm run source:cleanup

      - name: Install dependencies
        run: npm ci

      - name: Run Windows release QA
        run: |
          npm run qa:startup-adversarial
          npm run qa:static
          npm run qa:scripted-html-edit
          npm run qa:release-version
          npm run qa:theme-light

      - name: Build Windows installer + zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LEAF_BUILD_VERSION: ${{ needs.prepare-version.outputs.version }}
        run: npm run dist:win

      - name: Collect artifacts
        run: |
          version="${{ needs.prepare-version.outputs.version }}"
          out="release-v${version}"
          mkdir -p windows-artifacts
          find "$out" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) -exec cp {} windows-artifacts/ \;
          cd windows-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-Windows-${{ needs.prepare-version.outputs.version }}
          path: windows-artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish Windows artifacts to shared release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.prepare-version.outputs.version }}"
          tag="release-v${version}"
          cat > release-notes.md <<NOTES
          Leaf ${version} release artifacts.

          This release workflow computes the version once and passes it to every platform job,
          so Windows and macOS artifacts from this invocation share one version string.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Leaf ${version}" --notes-file release-notes.md --target "$GITHUB_SHA" --prerelease
          else
            gh release edit "$tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" windows-artifacts/* --clobber

  build-macos:
    name: Build Leaf for macOS (arm64 + x64)
    runs-on: macos-14
    needs: prepare-version
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply roadmap source cleanup
        run: npm run source:cleanup

      - name: Install dependencies
        run: npm ci

      - name: Run macOS release QA
        run: |
          npm run qa:static
          npm run qa:scripted-html-edit
          npm run qa:release-version
          npm run qa:theme-light

      - name: Build macOS dmg + zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LEAF_BUILD_VERSION: ${{ needs.prepare-version.outputs.version }}
        run: npm run dist:mac

      - name: Collect artifacts
        run: |
          version="${{ needs.prepare-version.outputs.version }}"
          out="release-v${version}"
          mkdir -p macos-artifacts
          find "$out" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} macos-artifacts/ \;
          cd macos-artifacts
          shasum -a 256 * > SHA256SUMS.txt
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-macOS-${{ needs.prepare-version.outputs.version }}
          path: macos-artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish macOS artifacts to shared release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.prepare-version.outputs.version }}"
          tag="release-v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Leaf ${version}" --notes "Leaf ${version} release artifacts." --target "$GITHUB_SHA" --prerelease
          fi
          gh release upload "$tag" macos-artifacts/* --clobber
